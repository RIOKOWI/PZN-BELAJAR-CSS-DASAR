<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr , th , td{
            border-style: solid;
            border-width: 2px;

            border-collapse: collapse;
            /* menyatukan garis tabel */

        }

        thead {
            background-color: red;
        }

        tr:hover {
            background-color: red;
        }

        .ganjil {
            background-color: aqua;
        }
        .genap {
            background-color: blueviolet;
        }
        
        th {
            text-align: start;
            text-transform: capitalize;
            
        }
        td {
            text-transform: capitalize;
            text-align: center;

        }
        
        table {
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr >
                <th>nama</th>
                <th>nilai</th>
            </tr>
        </thead>
        <tbody>
            <tr class="genap">
                <td>rio</td>
                <td>100</td>
            </tr>
            <tr class="ganjil">
                <td>rio</td>
                <td>100</td>
            </tr>
            <tr class="genap" >
                <td>rio</td>
                <td>100</td>
            </tr>
            <tr class="ganjil">
                <td>rio</td>
                <td>100</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
